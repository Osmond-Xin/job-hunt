# Candidate profile example.
#
# Copy to profile/profile.yml or run `job-hunt init` / `job-hunt import-resume`
# to create local candidate files.

candidate:
  full_name: "Example Candidate"
  email: "candidate@example.com"
  phone: "555-0100"
  location: "Toronto, ON, Canada"
  linkedin: "https://www.linkedin.com/in/example-candidate/"
  github: "https://github.com/example-candidate"
  portfolio_url: "https://candidate.example.com"
  target_roles:
    - "AI Engineer"
    - "Data Scientist"
    - "Software Engineer"
  target_locations:
    - "Canada"
    - "Remote Canada"

narrative:
  superpower: "Example: translating ambiguous product goals into reliable software systems."
  energizes: "Example: building useful AI tools with clear human review points."
  drains: "Example: high-volume applications with little role fit."
  deal_breakers: "Example: roles that require unsupported legal claims or unsafe automation."
  best_achievement: "Example: shipped a production workflow automation that saved measurable time."
  exit_story: "Example: seeking a role focused on production AI systems."
  # Optional: a truthful one-line work-authorization / availability statement,
  # rendered near the close of full-mode cover letters (e.g. PGWP timeline).
  availability: "Example: eligible to work full-time in Canada; available immediately."
  # Optional: single-line version of the same fact, rendered under the contact
  # row in the CV PDF header. Omit to leave the resume header unchanged.
  work_auth_line: "Example: authorized to work full-time in Canada — no sponsorship required."

apply:
  cover_letter_default: false
  auto_submit_enabled: false

workday:
  consent_terms_and_conditions: false

cowork:
  eligibility_category: ""
  transcript_pdf: ""
  academic_distinction_pdf: ""

# Immigration-priority regions (optional) — a job offer in these places
# advances the operator's PR goal, so the scorer accepts weaker background
# fit and the scan location filter always lets them through. Place names
# only; the system knows nothing about immigration rules.
immigration_priority:
  enabled: false
  provinces:
    - "Nova Scotia"
    - "New Brunswick"
  communities:
    - "Moncton"
    - "Thunder Bay"
  score_note: >
    Offers here advance permanent residency; treat location as a strong
    positive and lower the effective apply threshold by 0.5.
