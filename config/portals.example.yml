# Portal scanner example configuration.
#
# Copy to config/portals.yml and adjust the companies/filters for your search.

title_filter:
  positive:
    - "AI Engineer"
    - "LLM Engineer"
    - "Machine Learning"
    - "Data Scientist"
    - "Data Analyst"
    - "Analytics Engineer"
    - "Software Engineer"
    - "Product Manager"
  negative:
    - "unpaid"
    - "sales"
    - "marketing"

tracked_companies:
  # Direct ATS examples.
  - name: "Example Greenhouse Company"
    enabled: false
    careers_url: "https://job-boards.greenhouse.io/example"

  - name: "Example Ashby Company"
    enabled: false
    careers_url: "https://jobs.ashbyhq.com/example"

  - name: "Example Lever Company"
    enabled: false
    careers_url: "https://jobs.lever.co/example"

  # BambooHR and Lever boards are read the same way (verified 2026-09-27).
  - name: "City of Hamilton"
    enabled: true
    careers_url: "https://cityofhamilton.bamboohr.com/careers"

  - name: "Okanagan College"
    enabled: true
    careers_url: "https://jobs.lever.co/okanagan"

  # Brave WebSearch example. Requires config/settings.yml web_search.provider=brave
  # and BRAVE_API_KEY in .env.
  - name: "Example Search Company"
    enabled: false
    scan_method: "websearch"
    scan_query: 'site:example.com/careers "AI Engineer" OR "Data Scientist"'

# Cross-employer discovery channels — fired via WebSearch (Brave) and dedup'd
# against scan-history / pipeline / tracker. Each channel expands its
# `query_template` over `profile.yml::candidate.target_roles` ×
# `target_locations`, so set those before enabling a channel.
#
# All channels default to `enabled: false` to avoid surprise quota burn. The
# Brave free tier is ~2k queries/month and channels run N (roles) × M
# (locations) queries each; `job-hunt search-usage` shows the counters.
#
# `modes:` gates the channel to one or more of [student, full]. Channel-level
# behaviour is independent of the per-company `eligibility_tags` filter used
# for tracked_companies.
discovery_channels:
  - id: linkedin
    enabled: false
    modes: [full]
    query_template: '{role} jobs {location} site:linkedin.com/jobs'

  - id: indeed
    enabled: false
    modes: [full]
    query_template: '"{role}" {location} site:indeed.com/jobs'

  - id: glassdoor
    enabled: false
    modes: [full]
    query_template: '"{role}" {location} site:glassdoor.com/Job'

  # For Canadian roles this is superseded by the `yc_companies` tier below,
  # which reads ycombinator.com directly at no search quota.
  - id: ycombinator
    enabled: false
    modes: [full]
    query_template: '{role} site:workatastartup.com'

  - id: wellfound
    enabled: false
    modes: [full]
    query_template: '{role} site:wellfound.com'

  # Student-mode channels. Many of these are gated to specific schools or
  # programs and only show partial results to non-members — leave enabled
  # only the ones you have access to.
  - id: waterlooworks
    enabled: false
    modes: [student]
    query_template: '"{role}" co-op site:waterlooworks.uwaterloo.ca'

  - id: talentegg
    enabled: false
    modes: [student]
    query_template: '"{role}" intern co-op site:talentegg.ca'

  - id: magnet
    enabled: false
    modes: [student]
    query_template: 'student "{role}" site:magnet.today'

  - id: jobbank_student
    enabled: false
    modes: [student]
    query_template: '"{role}" co-op site:jobbank.gc.ca'

  # Immigration-priority channels (see profile.yml::immigration_priority).
  # `locations:` overrides the profile-wide target_locations for this channel
  # only — one query per role × location, so keep the list focused. Postings
  # from these places also bypass the scorer's usual domain-fit bar.
  - id: jobbank_immigration
    enabled: false
    modes: [full]
    query_template: '"{role}" "{location}" site:jobbank.gc.ca'
    locations: ["Moncton", "Fredericton", "Charlottetown", "Winnipeg"]

  - id: indeed_smalltown
    enabled: false
    modes: [full]
    query_template: '"{role}" "{location}" site:ca.indeed.com'
    locations: ["Thunder Bay", "Sudbury", "Saskatoon"]

# ---------------------------------------------------------------------------
# Tier 8 — Chinese-language community boards (job_hunt/services/cn_boards.py).
# Technical postings only; titles are screened before any detail request.
# ---------------------------------------------------------------------------
cn_boards:
  enabled: true
  delay_s: 0.6
  timeout_s: 30.0
  boards:
    51ca:
      enabled: true
      max_pages: 90       # ~66 pages measured 2026-09-16; bounds a runaway
    vansky:
      enabled: true
      max_age_days: 14    # walk back until free ads are older than this
      max_pages: 40

# Tier 9 — accelerator and VC portfolio boards, all on the Getro JSON API.
# Added 2026-09-18, after he placed himself in the early-stage lane: "我很适合
# 初创企业。我的工作简历和背景也都是初创企业的". These boards are where seed-stage
# Canadian companies post; the national aggregators carry them late or not at all.
#
# `network_id` is the integer in props.pageProps.network.id of the board's own
# HTML — NOT the slug. Re-read it from the page if a board ever returns nothing.
# Boards that are NOT Getro and so cannot go here: jobs.golden.ventures and
# portfoliojobs.panache.vc (Consider platform, bot-walled), Wellfound, DMZ.
#
# The API ignores hitsPerPage and always returns 20 rows a page, so the tier
# searches by role instead of walking whole boards: queries x boards x max_pages
# bounds the request count (8 x 6 x 2 = 96 worst case, ~2 minutes with the delay).
getro_boards:
  enabled: true
  delay_s: 0.4
  timeout_s: 30.0
  max_pages: 2
  # Server-side location facet. "Canada" narrowed Communitech 1183 -> 1007.
  locations:
    - Canada
  # His lanes, in the boards' own vocabulary. Keep this short: every query is a
  # request per board per page, and the positive title filter runs downstream.
  queries:
    - ai engineer
    - machine learning
    - forward deployed
    - software developer
    - data engineer
    - solutions engineer
    - full stack
    - systems analyst
  boards:
    - id: communitech
      network_id: 8936
      label: Communitech (Waterloo Region)
      enabled: true
      # Big-employer heavy (KPMG, EY, GHD) next to the startups — measured 2026-09-18.
    - id: mars
      network_id: 383
      label: MaRS Discovery District (Toronto)
      enabled: true
    - id: inovia
      network_id: 1201
      label: Inovia Capital (Montreal)
      enabled: true
    - id: real-ventures
      network_id: 166
      label: Real Ventures
      enabled: true
    - id: antler
      network_id: 7715
      label: Antler (global, includes the Toronto cohort)
      enabled: true
    - id: invest-ottawa
      network_id: 1546
      label: Invest Ottawa
      enabled: true
    - id: georgian
      network_id: 14282
      label: Georgian
      enabled: true
    - id: portage
      network_id: 144
      label: Portage Ventures
      enabled: true
    - id: pender
      network_id: 3854
      label: Pender Ventures
      enabled: true
    - id: queertech
      network_id: 883
      label: QueerTech
      enabled: true
    - id: getro-community
      network_id: 8870
      label: Getro Community
      enabled: true

# Tier 4b — SaskJobs.ca (job_hunt/services/saskjobs.py). Rows are kept only when
# their NOC code is in `jobbank_direct.noc_codes`; with no such list the tier
# reads nothing. Occupation comes from the code, so no positive title filter.
saskjobs:
  enabled: true
  delay_s: 1.0
  timeout_s: 30.0
  max_pages: 10

# Tier 5 — public-sector boards (job_hunt/services/gov_boards.py). Besides the
# built-in boards (gnwt, ns_gov, nb_gov, mb_gov, nsha, wrha), a board can be
# defined wholly here by its platform URL plus a `company`:
#   oracle_url          any Oracle Candidate Experience URL (.../sites/<site>/...)
#   successfactors_url  the SuccessFactors career site's root
gov_boards:
  enabled: true
  delay_s: 1.5
  timeout_s: 30.0
  boards:
    nu_gov:
      enabled: true
      company: Government of Nunavut
      oracle_url: https://fa-exux-saasfaprod1.fa.ocs.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_5/requisitions
      max_pages: 4      # 92 postings at 50 per page (2026-09-27)
    ab_gov:
      enabled: true
      company: Government of Alberta
      successfactors_url: https://jobpostings.alberta.ca
      max_pages: 8      # 130 postings at 25 per page (2026-09-27)
    cmhc:
      enabled: true
      company: Canada Mortgage and Housing Corporation
      successfactors_url: https://careers.cmhc-schl.gc.ca
      max_pages: 4
    nrc:
      enabled: true
      company: National Research Council Canada
      successfactors_url: https://recruitment-recrutement.nrc-cnrc.gc.ca
      max_pages: 4
    hsn:
      enabled: true
      company: Health Sciences North
      successfactors_url: https://careers.hsnsudbury.ca
      title_screen: true    # a hospital: titles are screened by the model
      max_pages: 6

# Tier 11 — single-employer career sites (job_hunt/services/employer_boards.py).
# `platform` is oracle | jibe | ukg | hrsmart | successfactors and `url` the
# employer's career-site URL. `max_pages` may be set per employer.
# General employers, so these rows face the positive title filter.
employer_boards:
  enabled: true
  delay_s: 1.0
  timeout_s: 30.0
  max_pages: 10         # pages of 200 (Oracle) or 100 (Jibe, UKG)
  employers:
    - name: J.D. Irving
      platform: oracle
      url: https://hcpd.fa.ca2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_5003/requisitions
    - name: City of Thunder Bay
      platform: jibe
      url: https://careers.thunderbay.ca
    - name: Yukon Hospitals
      platform: ukg
      # The board GUID cannot be guessed; take it from the employer's own
      # careers link (here, the redirect behind yukonhospitals.ca/en/careers).
      url: https://recruiting.ultipro.ca/YUK5001YUHC/JobBoard/7ed94cc1-3925-495d-a225-c5d6b7c3ad3e/
    - name: Government of Yukon
      platform: hrsmart
      url: https://yukongovernment.hua.hrsmart.com/hr/ats/JobSearch/viewAll
      notes: "hrSmart, 47 postings in 2 pages (2026-09-27), mostly nurses and trades. YNP territory."
    - name: BC Public Service
      platform: hrsmart
      url: https://bcpublicservice.hua.hrsmart.com/hr/ats/JobSearch/viewAll
      # 84 postings in 4 pages of 25 (2026-09-27). hrSmart advertises no total
      # and serves its last page again past the end; the walk stops there.
    - name: WSIB
      platform: oracle
      url: https://wsib-iaepup.fa.ocs.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001/requisitions
    - name: Emera
      platform: jibe
      url: https://careers.emera.com
    - name: Island Health
      platform: hrsmart
      url: https://islandhealth.hua.hrsmart.com/hr/ats/JobSearch/viewAll
      max_pages: 55     # per-employer budget: ~1,229 postings at 25 a page
    - name: ICBC
      platform: successfactors
      url: https://careers.icbc.com
    - name: SaskPower
      platform: successfactors
      url: https://jobs.saskpower.com
    - name: SaskTel
      platform: successfactors
      url: https://jobs.sasktel.com

# Tier 12 — WorkPEI (job_hunt/services/workpei.py), over its WordPress REST API.
# General board: positive title filter.
workpei:
  enabled: true
  delay_s: 1.0
  timeout_s: 30.0
  max_pages: 6          # 271 postings in 3 pages of 100 (2026-09-27)

# Tier 13 — YC companies hiring in Canada (job_hunt/services/yc_companies.py).
# One request per company; YC leaves postings up for years, so older ones go.
yc_companies:
  enabled: true
  delay_s: 1.0
  timeout_s: 30.0
  max_age_days: 120

# Tier 6 — Workday CxS JSON boards (job_hunt/services/workday_boards.py). Paste
# any myworkdayjobs.com URL as `url`. `location_hint` is appended to every row's
# location, for tenants that name a building ("City Hall") instead of a town.
workday_boards:
  enabled: true
  page_size: 20
  max_pages: 3
  delay_s: 1.0
  timeout_s: 30.0
  employers:
    - name: Brock University
      url: https://brocku.wd3.myworkdayjobs.com/brocku_careers
      location_hint: "St. Catharines, ON"
    - name: City of Niagara Falls
      url: https://niagarafalls.wd10.myworkdayjobs.com/CNF
      location_hint: "Niagara Falls, ON"
    - name: City of Port Colborne
      url: https://portcolborne.wd10.myworkdayjobs.com/CPC
      location_hint: "Port Colborne, ON"
    - name: Fallsview Casino / Casino Niagara (Mohegan)
      url: https://mohegan.wd1.myworkdayjobs.com/Niagara
      location_hint: "Niagara Falls, ON"
    - name: WCB Alberta
      url: https://wcbalberta.wd10.myworkdayjobs.com/wcbalbertacareers
      location_hint: "Alberta"

# Tier 14 — WorkBC (job_hunt/services/workbc.py), 2026-09-27. BC's provincial
# board over its public search API: a title search per profile role term
# (`queries` overrides). Job Bank mirrors are skipped; each row records the
# employer's own posting URL. General board: positive title filter.
# 25 roles x up to max_pages pages of 100, paced by delay_s.
workbc:
  enabled: true
  delay_s: 1.0
  timeout_s: 45.0
  max_pages: 3

# Tier 15 — Workable cross-employer search (job_hunt/services/workable_search.py),
# 2026-09-27. Every Workable customer's Canadian postings, by profile role term
# (`queries` overrides). 20 rows a page, token-paged. Positive title filter.
workable_search:
  enabled: true
  location: Canada
  delay_s: 1.0
  timeout_s: 30.0
  max_pages: 5
